name: Package and release skill

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Package skill
        run: python scripts/package_skill.py checkmarx-one-multi-tool

      - name: Determine release tag
        id: tag
        run: |
          version=$(cat .claude/skills/checkmarx-one-multi-tool/VERSION)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.skill --clobber
          else
            gh release create "$tag" dist/*.skill \
              --title "$tag" \
              --generate-notes \
              --target "${{ github.sha }}"
          fi
