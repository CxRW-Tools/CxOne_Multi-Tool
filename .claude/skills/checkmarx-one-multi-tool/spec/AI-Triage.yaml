openapi: 3.1.0
x-stoplight:
  id: 4efb56323bf3b
info:
  title: AI Triage REST API
  description: "<details>\r\n  <summary><b>{Base_URL}/api/ai-triage</b></summary>\r\n\r\n* US: https://ast.checkmarx.net/api/ai-triage<br>\r\n* US2: https://us.ast.checkmarx.net/api/ai-triage<br>\r\n* EU: https://eu.ast.checkmarx.net/api/ai-triage<br>\r\n* EU2: https://eu-2.ast.checkmarx.net/api/ai-triage<br>\r\n* DEU: https://deu.ast.checkmarx.net/api/ai-triage<br>\r\n* Australia & NZ: https://anz.ast.checkmarx.net/api/ai-triage<br>\r\n* India: https://ind.ast.checkmarx.net/api/ai-triage<br>\r\n* Singapore: https://sng.ast.checkmarx.net/api/ai-triage<br>\r\n* UAE: https://mea.ast.checkmarx.net/api/ai-triage<br>\r\n* Israel: https://gov-il.ast.checkmarx.net/api/ai-triage\r\n\r\n</details>\r\n\r\n## Overview\r\n\r\nThe **AI Triage REST API** enables you to submit vulnerabilities for AI-powered triage and retrieve the resulting analysis.\r\n\r\nYou can triage specific vulnerabilities by scanner type and result ID.\r\n\r\nTriage requests are processed asynchronously. After submitting a request, use the corresponding GET endpoint to retrieve the triage result. If processing is still in progress, the API returns the current job status until the result is available.\r\n\r\n### Limitations\r\n- Currently supported for `SCA` and `SAST` vulnerabilities only.\r\n\r\n## Example Workflow\r\n\r\n1. Use [**`GET /api/results`**](https://checkmarx.stoplight.io/docs/checkmarx-one-api-reference-guide/whqbw17zn6rg1-retrieve-scan-results-all-scanners) to retrieve the `alternateId` values for the vulnerabilities you want to triage.\r\n2. Use **`POST /triage`** to submit one or more vulnerabilities for AI-powered triage.\r\n3. Use [**`GET /api/risks`**](https://checkmarx.stoplight.io/docs/checkmarx-one-api-reference-guide/kiqtq6jdroowm-retrieve-risks-legacy) to retrieve the `groupId` for the corresponding vulnerability group within the project.\r\n4. Use **`GET /triage/{project_id}/{group_id}`** to retrieve the AI triage result.\r\n5. If the response indicates that processing is still in progress, repeat the GET request until the completed analysis is returned.\r\n## Authentication \r\nAuthentication for all Checkmarx One endpoints is done using JWT (JSON Web Token) access token. Access tokens are generated using the [Authentication API](Authentication.yaml)."
  version: 1.0.0
paths:
  /triage:
    post:
      summary: Initiate AI Triage
      description: "Submits a request to triage vulnerabilities within a scan.\r\n\r\nTo triage vulnerabilities, provide one or more scanner buckets containing the scanner type and associated result IDs. The required result IDs are obtained from the `alternateId` field returned by the [**`GET /api/results`**](https://checkmarx.stoplight.io/docs/checkmarx-one-api-reference-guide/whqbw17zn6rg1-retrieve-scan-results-all-scanners) endpoint.  \r\n\r\nThe request is processed asynchronously. A successful request returns `202 Accepted`. After submitting the request, use the GET endpoint to retrieve the triage results or check the current job status."
      operationId: create_triage_triage_post
      parameters:
        - $ref: '#/components/parameters/Uploads_AuthHeader'
        - $ref: '#/components/parameters/Uploads.versionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriageRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageAcceptedResponse'
        '400':
          description: AI Triage could not run. The source code is no longer available.
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageErrorResponse'
        '402':
          description: Insufficient AI consumption credits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageErrorResponse'
        '403':
          description: Feature not enabled or insufficient roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageErrorResponse'
        '422':
          description: Validation error
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageErrorResponse'
        '503':
          description: External service unavailable
      x-stoplight:
        id: qexyrah8hnbwv
    servers:
      - url: 'https://ast.checkmarx.net/api/ai-triage'
        description: US
      - url: 'https://us.ast.checkmarx.net/api/ai-triage'
        description: US2
      - url: 'https://us.ast.checkmarx.net/api/ai-triage'
        description: EU
      - url: 'https://eu-2.ast.checkmarx.net/api/ai-triage'
        description: EU2
      - url: 'https://deu.ast.checkmarx.net/api/ai-triage'
        description: DEU
      - url: 'https://anz.ast.checkmarx.net/api/ai-triage'
        description: Australia & NZ
      - url: 'https://ind.ast.checkmarx.net/api/ai-triage'
        description: India
      - url: 'https://sng.ast.checkmarx.net/api/ai-triage'
        description: Singapore
      - url: 'https://mea.ast.checkmarx.net/api/ai-triage'
        description: UAE
      - url: 'https://gov-il.ast.checkmarx.net/api/ai-triage'
        description: Israel
  '/triage/{project_id}/{group_id}':
    get:
      summary: Retrieve AI Triage Results
      description: "Retrieves the AI triage result for a vulnerability group within a project.\r\n\r\nTo retrieve a triage result, you must specify the project's identifier (`project_id`) and the identifier of the vulnerability group (`group_id`).\r\n\r\nIf triage has completed, the endpoint returns the full analysis, including the triage verdict, summary, confidence score, and supporting details. If processing has not yet completed, the endpoint returns the current job status. If the triage operation failed, the endpoint returns a failed job status.\r\n\r\n> The recommended way to obtain the `group_id` is to call [**`GET /api/risks`**](RiskOrchestration.yaml/paths/~1/get) for the specified project and use the `groupId` field of the corresponding risk object.\r\n>\r\n> If necessary, you can construct the `group_id` manually:\r\n>\r\n> - **SCA:** Construct the value using the following format:\r\n>   <br>\r\n>   `<similarityId>#-#<packageIdentifier>#-#<projectId>`\r\n>   <br>\r\n>   Where:\r\n>   - `similarityId` is the vulnerability's `similarityId` returned by `GET /api/results`.\r\n>   - `packageIdentifier` is the package identifier (`data.packageIdentifier`) returned by `GET /api/results`.\r\n>   - `projectId` is the project identifier used in this request.\r\n>\r\n> - **SAST:** Use the `similarityId` returned by `GET /api/sast-results`. If your SAST scanner is configured to group similar results by **Attack Vector ID**, use the `attackVectorID` instead.\r\n> **Important:** If the `group_id` contains reserved URL characters (such as `#`), URL-encode the value before using it as a path parameter. For example, replace each `#` with `%23`."
      operationId: get_triage_triage__project_id___group_id__get
      parameters:
        - name: project_id
          in: path
          description: The unique identifier of the project containing the vulnerability group.
          required: true
          schema:
            type: string
            title: Project Id
        - name: group_id
          in: path
          description: "The identifier of the vulnerability group to retrieve. \r\n > Retrieve this value by calling the [**`GET /api/risks`**](RiskOrchestration.yaml/paths/~1/get) endpoint for the specified `{project_id}`. Use the `groupId` field (**not** the `id` field) of the corresponding `risk` object as the `{group_id}` path parameter."
          required: true
          schema:
            type: string
            title: Group Id
        - $ref: '#/components/parameters/Uploads_AuthHeader'
        - $ref: '#/components/parameters/Uploads.versionHeader'
      responses:
        '200':
          description: 'Returns the completed triage result for the requested vulnerability group, or the current job status if processing has not yet completed.'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TriageResultDetailSchema'
                  - $ref: '#/components/schemas/TriageResultInProgressSchema'
          headers: {}
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageErrorResponse'
        '403':
          description: Feature not enabled or insufficient roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageErrorResponse'
        '404':
          description: Triage result not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageErrorResponse'
      x-stoplight:
        id: 4i2y6v8nsy6is
    servers:
      - url: 'https://ast.checkmarx.net/api/ai-triage'
        description: US
      - url: 'https://us.ast.checkmarx.net/api/ai-triage'
        description: US2
      - url: 'https://eu.ast.checkmarx.net/api/ai-triage'
        description: EU
      - url: 'https://eu-2.ast.checkmarx.net/api/ai-triage'
        description: EU2
      - url: 'https://deu.ast.checkmarx.net/api/ai-triage'
        description: DEU
      - url: 'https://anz.ast.checkmarx.net/api/ai-triage'
        description: Australia & NZ
      - url: 'https://ind.ast.checkmarx.net/api/ai-triage'
        description: India
      - url: 'https://sng.ast.checkmarx.net/api/ai-triage'
        description: Singapore
      - url: 'https://mea.ast.checkmarx.net/api/ai-triage'
        description: UAE
      - url: 'https://gov-il.ast.checkmarx.net/api/ai-triage'
        description: Israel
